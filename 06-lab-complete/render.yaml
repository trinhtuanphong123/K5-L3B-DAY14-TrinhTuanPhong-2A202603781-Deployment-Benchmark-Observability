# Render Blueprint: web service Docker + Key Value (Redis). AGENT_API_KEY điền trên Dashboard (sync: false), không ghi trong file.
services:
  - type: web
    name: k5-day14-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: k5-day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"

  - type: keyvalue
    name: k5-day14-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
