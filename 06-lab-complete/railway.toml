# Railway: build bằng Dockerfile; app nghe biến PORT Railway cấp (CMD trong Dockerfile).
# Đặt biến trên Railway: AGENT_API_KEY (secret), REDIS_URL = ${{Redis.REDIS_URL}} từ plugin Redis, ENVIRONMENT=production.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
